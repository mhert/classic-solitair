[workspace]
resolver = "3"
members = [
    "crates/sol-engine",
    "crates/sol-session",
    "crates/sol-theme",
    "crates/sol-presenter",
    "crates/sol-render-wgpu",
    "crates/soltool",
    "crates/sol-shell",
    "crates/sol-qt",
    "crates/sol-win32",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.94"
authors = ["mhert <mathias@mh.cx>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
serde_json = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Broad quality net — warn locally, denied in CI via -D warnings.
pedantic = { level = "warn", priority = -1 }

# The no-panic set — hard errors everywhere, always.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# Documentation discipline.
missing_errors_doc = "deny"

# Documented pedantic opt-outs — keep this list short and justified.
module_name_repetitions = "allow"   # e.g. EngineError in module `engine` is fine
must_use_candidate = "allow"        # apply #[must_use] by judgement, not blanket
