[workspace]
resolver = "3"
members = [
    "crates/sol-engine",
    "crates/sol-session",
    "crates/sol-theme",
    "crates/sol-xbrz",
    "crates/sol-presenter",
    "crates/sol-render-wgpu",
    "crates/sol-frontend",
    "crates/soltool",
    "crates/sol-shell",
    "crates/sol-qt",
    "crates/sol-win32",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.94"
authors = ["mhert <mathias@mh.cx>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
serde_json = "1"
# preserve_order: `[backs]` and `[sounds]` are declaration-ordered maps
# (sol-theme's Manifest contract) — the default map deserializes tables
# resorted by key, which loses that order.
toml = { version = "1", features = ["preserve_order"] }
proptest = "1"
directories = "6"
tempfile = "3"
# default-features = false + deflate: the only compression method sol-theme's
# ZipSource / soltool's zip writer need, keeps the dependency tree lean.
zip = { version = "8", default-features = false, features = ["deflate"] }
# sol-theme's SVG dimension probe (crates/sol-theme/src/svg.rs) uses this
# directly for a presence-only guard in front of `usvg` (below): `usvg` itself
# accepts a dimensionless SVG, silently defaulting/auto-detecting a size that
# could otherwise pass as a valid card size. Also arrives transitively via
# `usvg`, so keeping it a direct dependency adds zero tree weight.
roxmltree = "0.21"
# The xBRZ pixel-art upscaler behind `sol-xbrz`, a pure-Rust port of upstream
# xBRZ 1.8. `large_lut` is required for output fidelity, not performance: the
# default 5-bit colour lookup table diverges from upstream on every pixel,
# while the 8-bit one reproduces its distance table exactly at the usual
# 64 MiB / one-time-build cost.
xbrz-rs = { version = "0.1", features = ["large_lut"] }
# derive: `#[derive(Parser/Subcommand/Args)]` — soltool's CLI definitions.
clap = { version = "4", features = ["derive"] }
# Reads PE (Win32/PE32+) resource directories for `soltool extract`. Memory-safe,
# zero-allocation, no_std-capable — parses the header-less DIBs the same decoder
# handles for NE. NE (Win16) is hand-rolled (pelite cannot parse NE).
pelite = "0.10"
# Decodes/encodes soltool's shared PNG raster utility (soltool's one place
# that touches PNG pixels) and backs sol-theme's PNG dimension probe
# (crates/sol-theme/src/png.rs). sol-theme only reads header/IHDR info via
# `read_info` there — it never decodes pixel data.
png = "0.18"
# Decodes soltool's header-less DIB/BMP resource bitmaps
# (crates/soltool/src/dib.rs) via its BMP codec, replacing a hand-rolled
# BITMAPCOREHEADER/BITMAPINFOHEADER parser. default-features = false + bmp:
# only that one codec, not the PNG/JPEG/etc. others `image` bundles (this
# workspace has its own `png` crate above for PNG).
image = { version = "0.25", default-features = false, features = ["bmp"] }
# DocumentMut/InlineTable-based theme.toml renderer for soltool's
# manifest_writer — IndexMap-backed so declaration order is preserved, and
# escaping (including U+007F) is the crate's job instead of a hand-rolled
# string escaper.
toml_edit = "0.25"
# Renderer-grade SVG parser backing sol-theme's SVG dimension probe
# (crates/sol-theme/src/svg.rs) — the same parser the renderer will use, so
# "sol-theme accepts this SVG" and "the renderer can draw this SVG" become the
# same statement. default-features = false drops the text/font stack
# (fontdb/rustybuzz/ttf-parser/...), which a dimension-only probe never needs.
usvg = { version = "0.47", default-features = false }
# sol-render-wgpu's vector scaling pipeline: rasterizes theme SVGs at the
# exact target size on scale change. Same version as `usvg` above (resvg's
# parser IS usvg), so accepting and drawing a theme SVG stay one statement.
# default-features = false mirrors usvg: no text/font stack, no embedded
# raster images — theme SVGs are path-only by the format's design.
resvg = { version = "0.47", default-features = false }
# The playfield renderer. `webgl` keeps a future wasm build able to fall
# back to WebGL2 where WebGPU is unavailable (no-op on native targets).
wgpu = { version = "30", features = ["webgl"] }
# sol-shell's window/event loop. The dev harness only; sol-qt and
# sol-win32 bring their own native windowing. default-features = false to
# drop `wayland-csd-adwaita` (winit's drawn client-side decorations): its
# font stack bottoms out in the unmaintained `ttf-parser`
# (RUSTSEC-2026-0192), and this workspace keeps deny advisories at zero
# ignores. Cost: no fallback titlebar on compositors without server-side
# decorations — cosmetic only, for a dev harness.
winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
] }
# Minimal single-future block_on for wgpu's async adapter/device requests
# (they resolve immediately on native). Not an async runtime — the
# workspace stays sync-only (tokio remains banned in deny.toml).
pollster = "1"
# sol-qt's Qt6/QML integration (spec-mandated): the bridge macro crate,
# the Qt type wrappers, and the build-time C++/moc/qrc glue. qt_full =
# QtGui + QtQml + QtQuickControls wrappers only — none of cxx-qt-lib's
# optional third-party conversions (serde/chrono/image/...) are needed.
cxx = "1"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", default-features = false, features = ["qt_full"] }
cxx-qt-build = "0.9"
# Safe zero-copy casts of the renderer's vertex/index/uniform structs to
# the byte slices wgpu buffer uploads take.
bytemuck = { version = "1", features = ["derive"] }
# sol-win32's Win32 chrome (spec-mandated): the real menu bar, native
# dialogs, and controls. Maintenance-mode but API-stable; Win32 gaps are
# filled with direct `winapi` calls. Explicit feature list instead of the
# crate's "everything" default: only what the frontend actually builds.
# list-view + image-list: the card-back picker is an icon-mode list view
# over an image list of live thumbnails, not a combo box of theme-author
# identifiers. image-decoder: what lets `Bitmap::from_bin` take those
# thumbnails as PNGs through WIC, instead of expecting a raw DIB.
native-windows-gui = { version = "1.0.13", default-features = false, features = [
    "menu",
    "extern-canvas",
    "status-bar",
    "combobox",
    "clipboard",
    "animation-timer",
    "cursor",
    "message-window",
    "high-dpi",
    "list-view",
    "image-list",
    "image-decoder",
] }
# Direct Win32 calls where native-windows-gui has no wrapper (mouse capture
# during drags, raw pointer/keyboard messages on the playfield). Already
# native-windows-gui's own backbone, so this adds no new tree weight.
winapi = { version = "0.3", features = ["winuser", "windef", "minwindef", "commctrl"] }
# Builds the rwh 0.6 handles wgpu's unsafe surface target takes from
# native-windows-gui's HWNDs (nwg's own `raw-win-handle` feature is stuck
# on raw-window-handle 0.3, which wgpu cannot consume).
raw-window-handle = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Broad quality net — warn locally, denied in CI via -D warnings.
pedantic = { level = "warn", priority = -1 }

# The no-panic set — hard errors everywhere, always.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# Documentation discipline.
missing_errors_doc = "deny"

# Documented pedantic opt-outs — keep this list short and justified.
module_name_repetitions = "allow"   # e.g. EngineError in module `engine` is fine
must_use_candidate = "allow"        # apply #[must_use] by judgement, not blanket
