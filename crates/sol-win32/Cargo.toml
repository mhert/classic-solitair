[package]
name = "sol-win32"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Windows frontend: native-windows-gui chrome, Win32 menu bar, wgpu playfield."

[dependencies]
sol-engine = { path = "../sol-engine" }
sol-frontend = { path = "../sol-frontend" }
sol-presenter = { path = "../sol-presenter" }
sol-render-wgpu = { path = "../sol-render-wgpu" }
sol-session = { path = "../sol-session" }
sol-theme = { path = "../sol-theme" }
anyhow.workspace = true
thiserror.workspace = true

# The Win32 chrome and the on-window render path only exist on Windows;
# every other platform builds the stub main plus the platform-free app
# core (which is what the Linux CI lints and tests).
[target.'cfg(windows)'.dependencies]
native-windows-gui.workspace = true
winapi.workspace = true
raw-window-handle.workspace = true
wgpu.workspace = true
pollster.workspace = true

[dev-dependencies]
tempfile.workspace = true

# This crate cannot inherit the workspace `[lints]` table, which forbids unsafe
# code. It mirrors that table verbatim EXCEPT `unsafe_code = "deny"` (not
# "forbid"), so the wgpu surface bridge (src/gfx.rs) and the raw Win32 input
# path (src/ui.rs) can opt out with scoped, `// SAFETY:`-commented exceptions.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Broad quality net — warn locally, denied in CI via -D warnings.
pedantic = { level = "warn", priority = -1 }

# The no-panic set — hard errors everywhere, always.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# Documentation discipline.
missing_errors_doc = "deny"

# Documented pedantic opt-outs — keep this list short and justified.
module_name_repetitions = "allow"   # e.g. EngineError in module `engine` is fine
must_use_candidate = "allow"        # apply #[must_use] by judgement, not blanket
