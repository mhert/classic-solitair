# This project's dependency graph is checked with `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2                              # any advisory = error — no ignores

[licenses]
version = 2
allow = [
    "GPL-3.0",
    # This workspace's own crates declare "GPL-3.0-or-later" (workspace.package.license);
    # a distinct SPDX identifier from "GPL-3.0" above, needed so our own crates pass this
    # same check rather than just third-party dependencies.
    "GPL-3.0-or-later",
    # `xbrz-rs`, the pure-Rust xBRZ port behind `sol-xbrz`, is GPLv3 with no
    # "or-later" grant, so both it and the wrapper that depends on it declare
    # the conservative "GPL-3.0-only" — a distinct SPDX identifier from the
    # two above.
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    # arrayref 0.3.9 (via tiny-skia-path, pulled in by both tiny-skia <-
    # resvg and usvg — the SVG rasterizer stack sol-theme's dimension probe
    # and sol-render-wgpu's rendering both keep): a two-clause BSD license,
    # permissive and GPL-compatible — distinct SPDX identifier from the
    # three-clause BSD above.
    "BSD-2-Clause",
    "Unicode-3.0",
    "Zlib",
    # libloading (transitive dep of wgpu and winit, dynamic GL/Vulkan loader
    # plumbing): functionally MIT/BSD-2-Clause-equivalent, GPL-compatible.
    "ISC",
    # option-ext (transitive dep of `directories`): file-level copyleft,
    # GPL-compatible.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"               # tighten to "deny" once the tree is clean

[[bans.deny]]
# This project is sync-only by design; an async runtime creeping into the
# dependency tree is a design violation, not a preference.
name = "tokio"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
