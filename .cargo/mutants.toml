# cargo-mutants scope, matching the coverage decision the CI comments
# reference: full mutation gates apply to the crates whose behaviour is
# decidable without a GPU, a window, or a platform toolkit.
#
# sol-frontend is deliberately absent from the list below. It holds the
# frontends' shared application core — save, load, settings persistence,
# menu state, status text, window placement — and takes its state paths at
# construction rather than resolving them, so all of that is exercised
# against a temporary directory in ordinary tests. It is gated.
#
# What each excluded crate is gated by instead, stated as what actually
# exists rather than as an aspiration:
#
# - sol-render-wgpu: byte-exact golden-image tests against Mesa's software
#   rasterizers, plus scaling/atlas smoke tests. A mutation gate would need
#   a GPU per mutant.
# - sol-shell: a dev harness. Its winit event loop cannot run headless.
# - sol-qt: a headless `--smoke` self-test that boots the whole chrome,
#   instantiates every dialog, runs the render loop, fails on any QML
#   diagnostic, and asserts the persisted geometry. It runs on CI.
# - sol-win32: a smoke test that boots the chrome and renders frames on
#   WARP, the software DX12 adapter windows-latest carries. It runs on CI.
#
# What remains in the two frontend crates after the shared core moved out is
# chrome: widget construction, event wiring, and a render path, none of
# which can be constructed off its own platform.
exclude_globs = [
    "crates/sol-render-wgpu/**",
    "crates/sol-shell/**",
    "crates/sol-qt/**",
    "crates/sol-win32/**",
]
